<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Perch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f8f8fa; --surface: #ffffff; --surface-2: #f1f1f4; --surface-3: #e9e9ee;
    --border: #e4e4ea; --border-strong: #cfcfd8;
    --text: #1c1d24; --text-2: #5f6272; --text-3: #8e909f;
    --accent: #5e6ad2; --accent-soft: #eceefb; --accent-text: #4952c3; --on-accent: #ffffff;
    --draft: #6e7180;      --draft-bg: #eeeef2;
    --official: #1d9bf0;   --official-bg: #e3f2fd;
    --published: #16a34a;  --published-bg: #e2f5e9;
    --failed: #e5484d;     --failed-bg: #fde6e7;
    --missed: #d97706;     --missed-bg: #fdf0d9;
    --x-blue: #1d9bf0;
    --av: linear-gradient(135deg, #5e6ad2, #a5b4fc);
    --img-a: linear-gradient(135deg, #d7d9f7, #8f97e6);
    --img-b: linear-gradient(135deg, #cde4f7, #5fa8e0);
    --img-c: linear-gradient(135deg, #e8e3dc, #b8ad9d);
    --shadow: 0 10px 40px rgba(20, 30, 30, .14);
    --radius: 8px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --side-w: 224px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1011; --surface: #17181b; --surface-2: #1e1f24; --surface-3: #26272e;
      --border: #26272e; --border-strong: #363741;
      --text: #ededf0; --text-2: #9b9ca8; --text-3: #6b6c78;
      --accent: #7b83eb; --accent-soft: #24264a; --accent-text: #a4aaff; --on-accent: #0f1011;
      --av: linear-gradient(135deg, #5e6ad2, #a5b4fc);
      --img-a: linear-gradient(135deg, #3b3f7a, #7b83eb);
      --img-b: linear-gradient(135deg, #24405a, #5fa8e0);
      --img-c: linear-gradient(135deg, #4a453d, #8d8474);
      --draft: #9b9ca8;     --draft-bg: #25262c;
      --official: #6cb8f5;  --official-bg: #16283a;
      --published: #4ade80; --published-bg: #12291b;
      --failed: #f2555a;    --failed-bg: #331b1d;
      --missed: #fbbf24;    --missed-bg: #332811;
      --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1011; --surface: #17181b; --surface-2: #1e1f24; --surface-3: #26272e;
    --border: #26272e; --border-strong: #363741;
    --text: #ededf0; --text-2: #9b9ca8; --text-3: #6b6c78;
    --accent: #7b83eb; --accent-soft: #24264a; --accent-text: #a4aaff; --on-accent: #0f1011;
    --av: linear-gradient(135deg, #5e6ad2, #a5b4fc);
    --img-a: linear-gradient(135deg, #3b3f7a, #7b83eb);
    --img-b: linear-gradient(135deg, #24405a, #5fa8e0);
    --img-c: linear-gradient(135deg, #4a453d, #8d8474);
    --draft: #9b9ca8;     --draft-bg: #25262c;
    --official: #6cb8f5;  --official-bg: #16283a;
    --published: #4ade80; --published-bg: #12291b;
    --failed: #f2555a;    --failed-bg: #331b1d;
    --missed: #fbbf24;    --missed-bg: #332811;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--accent-text); }
  .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-2); }
  .faint { color: var(--text-3); }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [hidden] { display: none !important; }

  /* ---------- shell ---------- */
  .app { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; transition: grid-template-columns .18s ease; }
  .app.collapsed { --side-w: 64px; }
  .side { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; font-weight: 600; letter-spacing: -.01em; }
  .brand .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); flex: none; }
  .brand .name { flex: 1; white-space: nowrap; }
  .brand .collapse { color: var(--text-3); padding: 4px; border-radius: 4px; }
  .brand .collapse:hover { background: var(--surface-2); color: var(--text); }
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; width: 100%; text-align: left; color: var(--text-2); white-space: nowrap; }
  .nav:hover { background: var(--surface-2); color: var(--text); }
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
  .nav .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .side .spacer { flex: 1; }
  .acct { display: flex; align-items: center; gap: 10px; padding: 12px 6px 4px; border-top: 1px solid var(--border); white-space: nowrap; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--av); flex: none; }
  .avatar.none { background: var(--surface-3); border: 1px dashed var(--border-strong); }
  .acct .who { line-height: 1.25; overflow: hidden; }
  .acct .who small { display: block; color: var(--text-3); font-size: 12px; }
  .collapsed .brand .name, .collapsed .nav span:not(.count), .collapsed .nav .count, .collapsed .acct .who { display: none; }
  .collapsed .brand { padding: 4px 0 16px; flex-direction: column; gap: 10px; }
  .collapsed .nav { justify-content: center; padding: 10px; }
  .collapsed .acct { justify-content: center; }
  .collapsed .brand .collapse { display: none; }
  .collapsed .side { cursor: e-resize; }
  .collapsed .side .nav { cursor: pointer; }
  .row .txt b { font-weight: 500; flex: none; }
  .row .txt .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptitle { border: 0; border-bottom: 1px solid var(--border); padding: 4px 0 8px; font-weight: 500; font-size: 16px; background: none; width: 100%; outline: none; color: var(--text); }
  .ptitle:focus { border-color: var(--accent); }
  .ptitle::placeholder { color: var(--text-3); font-weight: 400; }
  .menu.tagpick { min-width: 220px; }
  .menu.tagpick .search { min-width: 0; margin-bottom: 4px; }
  .menu .create { color: var(--accent-text); }

  main { padding: 36px 40px 60px; min-width: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .page { display: none; }
  .page.on { display: block; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; gap: 16px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.015em; margin: 0; }
  h2 { font-size: 11.5px; font-weight: 500; color: var(--text-2); margin: 0 0 12px; letter-spacing: .04em; text-transform: uppercase; }
  h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-3); margin-left: 8px; }

  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--failed); }
  .btn.danger.solid { background: var(--failed); border-color: var(--failed); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.sm { padding: 5px 9px; font-size: 13px; }
  .btn.icon { padding: 7px; }
  .btn.sm.icon { padding: 5px; }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .btn:disabled { opacity: .5; cursor: default; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.draft { color: var(--draft); background: var(--draft-bg); }
  .pill.official { color: var(--official); background: var(--official-bg); }
  .pill.published { color: var(--published); background: var(--published-bg); }
  .pill.failed { color: var(--failed); background: var(--failed-bg); }
  .pill.missed { color: var(--missed); background: var(--missed-bg); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); font-size: 12px; white-space: nowrap; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); font-size: 13px; }
  .banner.missed { background: var(--missed-bg); color: var(--missed); }
  .banner.failed { background: var(--failed-bg); color: var(--failed); }
  .banner.info { background: var(--accent-soft); color: var(--accent-text); }
  .banner .btn { margin-left: auto; }
  .empty { padding: 44px 20px; text-align: center; color: var(--text-3); }
  .loadmore { display: flex; justify-content: center; padding: 14px; color: var(--text-3); font-size: 12.5px; }
  .loadmore button { color: var(--accent-text); font-weight: 500; padding: 6px 12px; border-radius: 6px; }
  .loadmore button:hover { background: var(--accent-soft); }
  .grid + .loadmore { grid-column: 1 / -1; }
  .ev.moreev { color: var(--text-2); font-weight: 500; padding-left: 19px; }
  .empty b { display: block; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }

  /* ---------- dashboard ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 32px; }
  .stat { padding: 18px 20px; }
  .stat .lbl { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .stat .val { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
  .stat .val.warn { color: var(--missed); }
  .stat .val.ok { color: var(--published); }
  .section { margin-bottom: 32px; }

  .list { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 100px 1fr auto auto; align-items: center; gap: 20px; padding: 14px 20px; border-top: 1px solid var(--border); cursor: pointer; }
  .row.five { grid-template-columns: 100px 1fr auto auto auto; }
  .row .why { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
  .newrow { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 20px; border-bottom: 1px solid var(--border); }
  .newrow input { flex: 1; border: 0; background: none; outline: none; padding: 6px 0; color: var(--text); }
  .newrow input::placeholder { color: var(--text-3); }
  .xcard .more { color: var(--x-blue); font-size: 15px; display: block; margin-top: 4px; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .row .when { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); line-height: 1.35; }
  .row .when b { display: block; color: var(--text); font-weight: 500; }
  .row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .row .txt .m { color: var(--text-3); display: inline-flex; align-items: center; gap: 3px; font-size: 12px; flex: none; }
  .row .tags { display: flex; gap: 6px; }
  .row .pid { font-family: var(--mono); font-size: 12px; color: var(--text-3); }

  /* ---------- filters ---------- */
  .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { padding: 6px 12px; color: var(--text-2); border-right: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--surface-2); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
  .seg.icons button { padding: 7px 10px; }
  .search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 10px; background: var(--surface); color: var(--text-3); min-width: 220px; }
  .search input { border: 0; background: none; outline: none; width: 100%; color: var(--text); }
  .search input::placeholder { color: var(--text-3); }
  .filters .right { margin-left: auto; }
  .menu { position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; min-width: 180px; display: flex; flex-direction: column; }
  .menu button { text-align: left; padding: 7px 10px; border-radius: 5px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .menu button:hover { background: var(--surface-2); }
  .menu button[aria-checked="true"] { color: var(--accent-text); font-weight: 500; }
  .menu button .n { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  /* ---------- resources ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .res { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-height: 160px; }
  .res:hover { border-color: var(--border-strong); }
  .res .top { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; }
  .res .top .kind { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
  .res .top .kind svg { width: 13px; height: 13px; }
  .res .top .date { margin-left: auto; font-family: var(--mono); }
  .res .title { font-weight: 500; }
  .res .body { color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .res .thumb { height: 92px; border-radius: 6px; }
  .res .foot { display: flex; gap: 6px; margin-top: auto; align-items: center; flex-wrap: wrap; }
  .res .foot .uses { margin-left: auto; font-size: 12px; color: var(--text-3); }

  /* ---------- calendar ---------- */
  .cal { overflow: hidden; }
  .cal .dow { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .cal .dow div { padding: 10px 12px; font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
  .cal .days { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 118px; }
  .day { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .day:nth-child(7n) { border-right: 0; }
  .day .n { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
  .day.out .n { opacity: .4; }
  .day.past { background: var(--surface-2); }
  .day.past .n { opacity: .55; }
  .day.past .ev { opacity: .75; }
  .day.past .ev:hover { opacity: 1; background: var(--surface-3); }
  .day.today .n { color: var(--accent-text); font-weight: 500; }
  .day.today .n::after { content: "today"; font-family: var(--sans); margin-left: 6px; font-size: 11px; }
  .ev { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 6px; border-radius: 4px; cursor: pointer; overflow: hidden; white-space: nowrap; }
  .ev:hover { background: var(--surface-2); }
  .ev .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .ev .t { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); flex: none; }
  .ev .s { overflow: hidden; text-overflow: ellipsis; }
  .ev.draft .dot { background: var(--draft); } .ev.official .dot { background: var(--official); }
  .ev.published .dot { background: var(--published); } .ev.failed .dot { background: var(--failed); }
  .ev.missed .dot { background: var(--missed); }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* ---------- settings ---------- */
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  .settings .col { display: flex; flex-direction: column; gap: 12px; }
  .settings .col h2 { margin-top: 18px; }
  .settings .col h2:first-child { margin-top: 0; }
  .set { padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
  .set .k { font-weight: 500; margin-bottom: 3px; }
  .set .d { color: var(--text-2); font-size: 13px; }
  .set select, .set input { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 7px 10px; min-width: 180px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 12px 20px 10px; border-bottom: 1px solid var(--border); }
  table.t td { padding: 11px 20px; border-top: 1px solid var(--border); }
  table.t tr:first-child td { border-top: 0; }
  table.t td.num, table.t th.num { text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.t tr.cur td:first-child { font-weight: 500; }
  table.t td .acts { display: flex; gap: 4px; justify-content: flex-end; visibility: hidden; }
  table.t tr:hover td .acts { visibility: visible; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12.5px; }
  .pager .btn { margin-left: auto; }
  .pager .btn + .btn { margin-left: 0; }

  /* ---------- modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(10, 14, 14, .45); display: none; align-items: center; justify-content: center; padding: 28px; z-index: 50; }
  .scrim.on { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); width: min(1180px, 100%); height: min(780px, 100%); display: grid; grid-template-rows: auto 1fr; overflow: hidden; position: relative; }
  .modal.md { width: min(820px, 100%); height: auto; max-height: 100%; }
  .modal.sm { width: min(520px, 100%); height: auto; }
  .mhead { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .mhead .id { font-family: var(--mono); color: var(--text-3); font-size: 12.5px; }
  .mhead .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .mbody { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; position: relative; }
  .editor { padding: 24px 26px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid var(--border); overflow: auto; }
  textarea.ta { width: 100%; min-height: 190px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: var(--surface); line-height: 1.55; font-size: 15px; }
  textarea.ta:focus { border-color: var(--accent); outline: none; }
  textarea.ta:read-only { background: var(--surface-2); color: var(--text-2); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 12px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; min-height: 26px; }
  .field label .right { margin-left: auto; }
  .slot.filled { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(8, 9, 12, .82); display: none; align-items: center; justify-content: center; padding: 40px; cursor: zoom-out; }
  .lightbox.on { display: flex; }

/* ============ tiny markdown ============ */
function md(src) {
  const lines = src.split('\n'); let out = '', i = 0;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++; out += `<pre><code>${esc(b.join('\n'))}</code></pre>`; continue; }
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++; continue; }
    if (/^---+$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^> /.test(l)) { let b = []; while (i < lines.length && /^> /.test(lines[i])) b.push(lines[i++].slice(2)); out += `<blockquote><p>${inline(b.join(' '))}</p></blockquote>`; continue; }
    if (/^[-*] /.test(l)) { let b = []; while (i < lines.length && /^[-*] /.test(lines[i])) b.push(`<li>${inline(lines[i++].slice(2))}</li>`); out += `<ul>${b.join('')}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { let b = []; while (i < lines.length && /^\d+\. /.test(lines[i])) b.push(`<li>${inline(lines[i++].replace(/^\d+\. /, ''))}</li>`); out += `<ol>${b.join('')}</ol>`; continue; }
    if (/^\|/.test(l)) { let rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); rows = rows.filter(r => !/^\|[\s:-|]+\|$/.test(r)).map(r => r.slice(1, -1).split('|').map(c => c.trim()));
      out += '<table class="t" style="margin:0 0 14px;border:1px solid var(--border);border-radius:6px"><tr>' + rows[0].map(c => `<th>${inline(c)}</th>`).join('') + '</tr>' + rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>'; continue; }
    if (l.trim() === '') { i++; continue; }
    let b = []; while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,3} |```|[-*] |\d+\. |> |\||---)/.test(lines[i])) b.push(lines[i++]);
    out += `<p>${inline(b.join(' '))}</p>`;
  }
  return out;
}

  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom + window.scrollY + 6) + 'px'; m.style.left = (r.left + window.scrollX) + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { onPick(b.dataset.v); closeMenu(); } });
  openMenu = m;
  setTimeout(() => document.addEventListener('click', closeMenuOnOutside), 0);
}
function closeMenuOnOutside(e) { if (openMenu && !openMenu.contains(e.target)) closeMenu(); }

  const inp = $('input', m);

}

let costPage = 0; const COST_PER_PAGE = 6;
function costTable() {

  return `<div class="card"><table class="t"><tr><th>Month</th><th class="num">Posts</th><th class="num">With link</th><th class="num">Reads</th><th class="num">Total</th></tr>

      <div class="pager"><span>${costPage * COST_PER_PAGE + 1}–${Math.min((costPage + 1) * COST_PER_PAGE, costMonths.length)} of ${costMonths.length} months · all time ${fmt.money(costMonths.reduce((s, c) => s + c.total, 0))}</span>
        <button class="btn sm icon" id="cost-prev" title="Newer months" ${costPage === 0 ? 'disabled' : ''}>${ic('left')}</button><button class="btn sm icon" id="cost-next" title="Older months" ${costPage >= pages - 1 ? 'disabled' : ''}>${ic('right')}</button></div></div>
    <div class="note" style="margin-top:8px">Publish $0.015 · publish with a link $0.200 · save a tweet $0.005 · connect $0.010 · image upload free.</div>`;
}

/* load more: mock page sizes are small so the behaviour is visible */
const PAGE = { posts: 8, res: 6, drawer: 5 };
function loadMore(total, shown, key, onMore) {

/* calendar */
let calMonth = new Date(2026, 8, 1); let calView = 'month'; let weekAnchor = new Date(NOW);
const DAY_CAP = 3;
render.cal = () => {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1); const startOff = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - startOff);
  const days = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  const cells = (calView === 'month' ? days.slice(0, days[35].getMonth() === m ? 42 : 35) : (() => { const w = []; const t = new Date(weekAnchor); const off = (t.getDay() + 6) % 7; for (let i = 0; i < 7; i++) { const d = new Date(t); d.setDate(t.getDate() - off + i); w.push(d); } return w; })());
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const unit = calView === 'month' ? 'month' : 'week';
  $('#p-cal').innerHTML = `
    <div class="head"><div class="inline" style="gap:14px"><h1>${calView === 'month' ? calMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : fmt.dm(cells[0]) + ' – ' + fmt.dm(cells[6]) + ' ' + cells[6].getFullYear()}</h1>
      <button class="btn icon" id="cal-prev" title="Previous ${unit}">${ic('left')}</button><button class="btn icon" id="cal-next" title="Next ${unit}">${ic('right')}</button><button class="btn ghost sm" id="cal-today" title="Jump to today">Today</button></div>
      <div class="inline"><div class="legend">${['draft', 'official', 'published', 'failed', 'missed'].map(s => `<span><i style="background:var(--${s})"></i>${s}</span>`).join('')}</div>
      <div class="seg"><button data-cv="month" aria-pressed="${calView === 'month'}" title="Month view">Month</button><button data-cv="week" aria-pressed="${calView === 'week'}" title="Week view">Week</button></div></div></div>
    <div class="card cal"><div class="dow">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="days" style="${calView === 'week' ? 'grid-auto-rows:420px' : ''}">${cells.map(d => {
        const evs = posts.filter(p => p.at && sameDay(new Date(p.at), d)).sort((a, b) => new Date(a.at) - new Date(b.at));
        const show = calView === 'month' ? evs.slice(0, DAY_CAP) : evs;
        return `<div class="day ${d.getMonth() !== m && calView === 'month' ? 'out' : ''} ${sameDay(d, NOW) ? 'today' : d < NOW ? 'past' : ''}"><span class="n">${d.getDate()}</span>${show.map(p => `<div class="ev ${shownStatus(p)}" data-post="${p.id}"><i class="dot"></i><span class="t">${fmt.time(p.at)}</span><span class="s">${p.title ? esc(p.title) : p.text ? esc(p.text.split('\n')[0]) : 'Empty post'}</span></div>`).join('')}${evs.length > show.length ? `<div class="ev moreev" data-week="${d.toISOString()}" title="Open this week">+${evs.length - show.length} more</div>` : ''}</div>`;
      }).join('')}</div></div>`;
  $('#cal-prev').onclick = () => { if (calView === 'month') calMonth = new Date(y, m - 1, 1); else weekAnchor.setDate(weekAnchor.getDate() - 7); render.cal(); };
  $('#cal-next').onclick = () => { if (calView === 'month') calMonth = new Date(y, m + 1, 1); else weekAnchor.setDate(weekAnchor.getDate() + 7); render.cal(); };
  $('#cal-today').onclick = () => { calMonth = new Date(NOW.getFullYear(), NOW.getMonth(), 1); weekAnchor = new Date(NOW); render.cal(); };
  $$('[data-cv]').forEach(b => b.onclick = () => { calView = b.dataset.cv; render.cal(); });
  $$('[data-week]').forEach(b => b.onclick = e => { e.stopPropagation(); weekAnchor = new Date(b.dataset.week); calView = 'week'; render.cal(); });
};

        <div style="min-width:0"><div class="tt" data-dview="${r.id}">${esc(resTitle(r))}${p.links.includes(r.id) ? ' <span class="faint">· linked</span>' : ''}</div><div class="sub">${r.type === 'image' ? fmt.bytes(r.bytes) + ' · ' + r.w + ' × ' + r.h : esc((r.text || r.body.replace(/^# .*\n+/, '')).slice(0, 80))}</div></div>
        <div class="acts">${drawerActions(r, p)}</div></div>`).join('')}
      ${list.length ? '' : '<div class="empty"><b>Nothing found</b></div>'}${loadMore(all.length, dshown, 'drawer')}</div>`;
  $('#dq').oninput = () => { const v = $('#dq').value; renderDrawer(); const i = $('#dq'); i.focus(); i.setSelectionRange(v.length, v.length); };
  const lm = $('[data-more="drawer"] button'); if (lm) { lm.onclick = () => { dshown += PAGE.drawer; renderDrawer(null, true); }; watchMore($('#drawer')); }
}
$('#scrim-post').addEventListener('click', e => { if (e.target === e.currentTarget) closePost(); });
document.addEventListener('click', e => { const o = e.target.closest('[data-post]'); if (o && !e.target.closest('#post-modal')) openPost(o.dataset.post); });

/* ============ resource modal ============ */
let curRes = null, editing = false, editOrig = '';
const editDirty = () => editing && (curRes.body + '␀
' + curRes.title) !== editOrig;
function startEdit() { editing = true; editOrig = curRes.body + '␀
' + curRes.title; }
function openRes(id) {
  if (id === 'new') { curRes = { id: 'new', type: 'md', title: 'Untitled note', body: '# Untitled note\n\n', created: NOW.toISOString(), updated: NOW.toISOString(), tags: [], notes: '' }; startEdit(); }
  else { curRes = JSON.parse(JSON.stringify(resById(id))); editing = false; }
  renderRes(); $('#scrim-res').classList.add('on');
}
function renderRes() {
  const r = curRes; const uses = r.id === 'new' ? [] : usedIn(r.id);
  const kind = { tweet: 'Tweet', image: 'Image', md: 'Note' }[r.type];
  const main = r.type === 'tweet' ? `<div class="xcard" style="max-width:600px"><div class="av other"></div><div>
      <div class="name"><b>${esc(r.authorName)}</b><span>@${esc(r.author)}</span></div>
      <div class="text">${previewText(r.text)}</div>
      <div class="meta">${fmt.time(r.posted)} · ${new Date(r.posted).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} · <a href="${esc(r.url)}" target="_blank" rel="noopener">Open on X</a></div></div></div>
      <div class="note" style="margin-top:16px">Text-only tweet, saved as a copy. Perch does not re-fetch it unless you press Refresh ($0.005).</div>`
    : r.type === 'image' ? `<div class="bigimg" style="${grad(r.grad)}">${r.w} × ${r.h}</div>`
    : editing ? `<div class="mdedit"><div class="pane"><h2>Raw</h2><textarea id="mdsrc" spellcheck="false">${esc(r.body)}</textarea></div><div class="pane"><h2>Preview</h2><div class="prose" id="mdout">${md(r.body)}</div></div></div>`
    : `<div class="prose">${md(r.body)}</div>`;
  $('#res-modal').innerHTML = `
    <div class="mhead"><span class="id">${r.id === 'new' ? 'new' : '#' + r.id}</span><span class="kind" style="display:inline-flex;gap:6px;align-items:center;color:var(--text-2)">${ic(resIcon(r))}${kind}</span>
      ${editing ? `<input type="text" id="rtitle" value="${esc(r.title)}" style="border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;background:var(--surface);font-weight:500;min-width:280px">` : `<b>${esc(resTitle(r))}</b>`}
      <div class="right">
        ${r.type === 'md' ? (editing ? `<button class="btn ghost sm icon danger" data-ract="cancel" title="Discard changes">${ic('undo')}</button><button class="btn primary sm icon" data-ract="save" title="Save note">${ic('check')}</button>` : `<button class="btn sm icon" data-ract="edit" title="Edit note">${ic('edit')}</button>`) : ''}
        ${r.type === 'tweet' ? `<button class="btn sm icon" data-ract="refresh" title="Re-fetch from X ($0.005)">${ic('refresh')}</button>` : ''}
        ${r.id !== 'new' && !editing ? `<button class="btn primary sm icon" data-ract="draft" title="New draft from this">${ic('copyplus')}</button><button class="btn ghost sm icon danger" data-ract="delete" title="Delete resource">${ic('trash')}</button>` : ''}
        <button class="btn ghost icon" data-rclose title="Close (Esc)">${ic('x')}</button></div></div>
    <div class="rbody">
      <div class="rmain ${editing ? 'editing' : ''}">${main}</div>
      <div class="rside">
        <div class="field"><label>Details</label><div class="kv">
          ${r.type === 'tweet' ? `<b>author</b><span>@${esc(r.author)}</span><b>posted</b><span>${fmt.dm(r.posted)} ${new Date(r.posted).getFullYear()}</span>` : ''}
          ${r.type === 'image' ? `<b>file</b><span>${esc(r.title)}</span><b>size</b><span>${fmt.bytes(r.bytes)}</span><b>pixels</b><span>${r.w} × ${r.h}</span><b>type</b><span>${r.mime}</span>` : ''}
          ${r.type === 'md' ? `<b>words</b><span>${r.body.split(/\s+/).filter(Boolean).length}</span><b>edited</b><span>${fmt.dm(r.updated)}</span>` : ''}
          <b>saved</b><span>${fmt.dm(r.created)} ${new Date(r.created).getFullYear()}</span></div></div>
        <div class="field"><label>Tags</label><div class="tagbox">${r.tags.map(t => `<span class="tag">${esc(t)}<button data-runtag="${esc(t)}">${ic('x')}</button></span>`).join('')}<button class="add" data-ract="tag">+ add</button></div></div>
        <div class="field"><label>Notes <span class="faint">private</span></label><textarea id="rnotes" placeholder="Why you saved this, how to use it…">${esc(r.notes)}</textarea></div>
        <div class="field"><label>Used in ${uses.length} post${uses.length === 1 ? '' : 's'}</label>
          <div class="linked">${uses.map(p => `<div class="link" data-post="${p.id}"><span class="k">${ic('pen')}</span><span>#${p.id} · ${p.title ? esc(p.title) : p.text ? esc(p.text.split('\n')[0].slice(0, 40)) : 'Empty post'}</span>${pill(p)}</div>`).join('') || '<span class="note">Not linked to any post yet.</span>'}</div></div>
      </div>
    </div>`;
  const src = $('#mdsrc'); if (src) { src.addEventListener('input', () => { r.body = src.value; $('#mdout').innerHTML = md(r.body); const h = r.body.match(/^# (.+)/m); if (h) { r.title = h[1]; const t = $('#rtitle'); if (t) t.value = h[1]; } }); if (r.id === 'new') setTimeout(() => src.focus(), 0); }
  const ti = $('#rtitle'); if (ti) ti.addEventListener('input', () => r.title = ti.value);
  $('#rnotes').addEventListener('change', e => { r.notes = e.target.value; saveRes(); toast('Notes saved'); });
}
function saveRes() {
  if (curRes.id === 'new') { curRes.id = Math.max(...resources.map(r => r.id)) + 1; curRes.created = NOW.toISOString(); resources.unshift(curRes); }
  else resources[resources.findIndex(r => r.id === curRes.id)] = curRes;
  curRes = JSON.parse(JSON.stringify(curRes)); render[page](); renderNav();
}
function closeRes() { $('#scrim-res').classList.remove('on'); curRes = null; editing = false; }
$('#res-modal').addEventListener('click', e => {
  const r = curRes; const t = e.target;
  const discard = () => { if (r.id === 'new') return closeRes(); curRes = JSON.parse(JSON.stringify(resById(r.id))); editing = false; renderRes(); };
  if (t.closest('[data-rclose]')) { if (editDirty()) return confirmDlg({ title: r.id === 'new' ? 'Discard this note?' : 'Discard unsaved changes?', body: '<p>Your edits are <b>not saved</b>. Close anyway?</p>', ok: 'Discard', danger: true, onOk: closeRes }); return closeRes(); }
  const act = t.closest('[data-ract]')?.dataset.ract;
  if (act === 'edit') { startEdit(); return renderRes(); }
  if (act === 'cancel') { if (editDirty()) return confirmDlg({ title: 'Discard unsaved changes?', body: '<p>The note goes back to its last saved version.</p>', ok: 'Discard', danger: true, onOk: discard }); return discard(); }
  if (act === 'save') { r.updated = NOW.toISOString(); editing = false; saveRes(); renderRes(); return toast('Note saved'); }
  if (act === 'refresh') return confirmDlg({ title: 'Refresh from X?', body: '<p>Fetches the tweet again. Costs <b>$0.005</b>. If it now has media or was deleted, Perch tells you and keeps the old copy.</p>', ok: 'Refresh ($0.005)', onOk: () => toast('Up to date, no changes') });
  if (act === 'draft') { closeRes(); cur = { id: 'new', status: 'draft', title: r.type === 'tweet' ? 'From @' + r.author : r.title, text: '', at: null, tags: r.tags.slice(), links: [r.id], media: r.type === 'image' ? [{ grad: r.grad, from: r.id }] : [] }; savePost('Draft created from ' + resTitle(r)); return $('#scrim-post').classList.add('on'); }
  if (act === 'delete') { const uses = usedIn(r.id); return confirmDlg({ title: 'Delete ' + resTitle(r) + '?', body: `<p>${uses.length ? `It is unlinked from <b>${uses.length} post${uses.length > 1 ? 's' : ''}</b> (${uses.map(p => '#' + p.id).join(', ')})${uses.some(p => p.status === 'published') ? ', including published ones' : ''}. Attached images stay on those posts, because attach makes a copy.` : 'It is not used by any post.'}</p>`, ok: 'Delete', danger: true, onOk: () => { resources = resources.filter(x => x.id !== r.id); posts.forEach(p => p.links = p.links.filter(x => x !== r.id)); closeRes(); render[page](); renderNav(); toast(uses.length ? `Deleted. Unlinked from ${uses.map(p => '#' + p.id).join(', ')}` : 'Deleted'); } }); }
  if (act === 'tag') { tagPicker(t.closest('[data-ract]'), r.tags, n => { r.tags.push(n); if (r.id !== 'new') saveRes(); renderRes(); }); return; }
  const un = t.closest('[data-runtag]'); if (un) { r.tags = r.tags.filter(x => x !== un.dataset.runtag); if (r.id !== 'new') saveRes(); return renderRes(); }
  const pl = t.closest('[data-post]'); if (pl) { closeRes(); openPost(pl.dataset.post); }
});
$('#scrim-res').addEventListener('click', e => { if (e.target === e.currentTarget && !editing) closeRes(); });
document.addEventListener('click', e => { const o = e.target.closest('[data-res]'); if (o && !e.target.closest('.modal')) openRes(+o.dataset.res); });

/* ============ add tweet / upload ============ */
function smOpen(html) { $('#sm-modal').innerHTML = html; $('#scrim-sm').classList.add('on'); }
function smClose() { $('#scrim-sm').classList.remove('on'); }
$('#scrim-sm').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('[data-sclose]')) smClose(); });
function openAddTweet() {
  smOpen(`<div class="mhead"><b>Save tweets</b><div class="right"><button class="btn ghost icon" data-sclose>${ic('x')}</button></div></div>
    <div class="sbody">
      <div class="field"><label>Tweet URLs <span class="faint">one per line</span></label><textarea class="urls" id="turls" placeholder="https://x.com/user/status/123…"></textarea></div>
      <div class="field"><label>Tags <span class="faint">applied to all</span></label><input type="text" id="ttags" placeholder="x-api, writing"></div>
      <div class="note">Reading a tweet costs <b>$0.005</b>. A URL already saved is free and returns the existing resource. Tweets with images, video, articles, replies, quotes, or retweets are rejected.</div>
      <div class="results" id="tres" hidden></div></div>
    <div class="sfoot"><span class="left" id="tcost"></span><button class="btn" data-sclose>Cancel</button><button class="btn primary" id="tsave">Save</button></div>`);
  const ta = $('#turls'); const upd = () => { const n = ta.value.split('\n').filter(l => l.trim()).length; $('#tcost').textContent = n ? `${n} URL${n > 1 ? 's' : ''} · up to ${fmt.money(n * .005)}` : ''; };
  ta.oninput = upd; setTimeout(() => ta.focus(), 0);
  $('#tsave').onclick = () => {
    const urls = ta.value.split('\n').map(l => l.trim()).filter(Boolean); if (!urls.length) return;
    const tags = $('#ttags').value.split(',').map(t => t.trim()).filter(Boolean);
    const out = urls.map((u, i) => {
      const m = u.match(/x\.com\/(\w+)\/status\/(\d+)/) || u.match(/twitter\.com\/(\w+)\/status\/(\d+)/);
      if (!m) return { u, st: 'bad', msg: 'Not a tweet URL' };
      const ex = resources.find(r => r.url === u); if (ex) return { u, st: 'dup', msg: 'Already saved · #' + ex.id, id: ex.id };
      if (i % 3 === 2) return { u, st: 'bad', msg: 'Rejected: has media' };
      const r = { id: Math.max(...resources.map(r => r.id)) + 1, type: 'tweet', author: m[1], authorName: m[1], text: 'Sample text of tweet ' + m[2].slice(-4) + '. In the real app this is fetched from X.', url: u, posted: '2026-09-01T12:00', created: NOW.toISOString(), tags, notes: '' };
      resources.unshift(r); return { u, st: 'ok', msg: 'Saved · #' + r.id + ' · $0.005', id: r.id };
    });
    const box = $('#tres'); box.hidden = false;
    box.innerHTML = out.map(o => `<div class="result" style="color:var(--${o.st === 'ok' ? 'published' : o.st === 'dup' ? 'text-2' : 'failed'})">${ic(o.st === 'bad' ? 'warn' : 'check')}<span class="u">${esc(o.u)}</span><span>${o.msg}</span></div>`).join('');
    $('#tsave').textContent = 'Done'; $('#tsave').onclick = smClose; ta.value = ''; $('#tcost').textContent = `${out.filter(o => o.st === 'ok').length} saved · charged ${fmt.money(out.filter(o => o.st === 'ok').length * .005)}`;
    render[page](); renderNav();
  };
}
function openUpload() {
  let files = [];
  smOpen(`<div class="mhead"><b>Upload images</b><div class="right"><button class="btn ghost icon" data-sclose>${ic('x')}</button></div></div>
    <div class="sbody">
      <div class="drop" id="drop">${ic('upload')}<span>Drop images here or <b>choose files</b></span><small>PNG, JPG, WebP, GIF · 5 MB each · upload is free</small></div>
      <div class="files" id="ufiles"></div>
      <div class="field"><label>Tags <span class="faint">applied to all</span></label><input type="text" id="utags" placeholder="design, perch"></div></div>
    <div class="sfoot"><span class="left" id="ucount"></span><button class="btn" data-sclose>Cancel</button><button class="btn primary" id="usave" disabled>Upload</button></div>`);
  const draw = () => { $('#ufiles').innerHTML = files.map((f, i) => `<div class="file"><span class="th" style="${grad(f.grad)}"></span><span>${esc(f.name)}${f.bad ? `<div class="bad">${f.bad}</div>` : ''}</span><span class="sz">${fmt.bytes(f.bytes)}</span><button class="btn ghost sm icon" data-rmf="${i}">${ic('x')}</button></div>`).join(''); const ok = files.filter(f => !f.bad).length; $('#ucount').textContent = files.length ? `${ok} of ${files.length} ready` : ''; $('#usave').disabled = !ok; $$('[data-rmf]').forEach(b => b.onclick = () => { files.splice(+b.dataset.rmf, 1); draw(); }); };
  $('#drop').onclick = () => { const s = [{ name: 'hero-shot.png', bytes: 2300000, grad: 'a' }, { name: 'diagram.jpg', bytes: 480000, grad: 'b' }, { name: 'huge-export.png', bytes: 7800000, grad: 'c', bad: 'Over 5 MB' }]; files.push(s[files.length % 3]); draw(); };
  $('#usave').onclick = () => { const tags = $('#utags').value.split(',').map(t => t.trim()).filter(Boolean); const ok = files.filter(f => !f.bad); ok.forEach(f => resources.unshift({ id: Math.max(...resources.map(r => r.id)) + 1, type: 'image', title: f.name, created: NOW.toISOString(), tags, bytes: f.bytes, w: 1600, h: 900, mime: 'image/png', grad: f.grad, notes: '' })); smClose(); render[page](); renderNav(); toast(`${ok.length} image${ok.length > 1 ? 's' : ''} uploaded`); };
}

/* ============ tooltips ============ */
const tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl);
let tipTimer = null, tipTarget = null;
function tipFor(el) { if (el.hasAttribute('title')) { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); } return el.dataset.tip; }
function showTip(el) {
  const text = tipFor(el); if (!text) return;
  tipTarget = el; tipEl.textContent = text; tipEl.classList.remove('on'); tipEl.style.left = '0px'; tipEl.style.top = '0px';
  const r = el.getBoundingClientRect(); const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = r.left + r.width / 2 - w / 2; x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  let y = r.bottom + 8; if (y + h > window.innerHeight - 8) y = r.top - h - 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.classList.add('on');
}
function hideTip() { clearTimeout(tipTimer); tipTimer = null; tipTarget = null; tipEl.classList.remove('on'); }
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[title],[data-tip]'); if (!el || el === tipTarget) return;
  hideTip(); tipFor(el); tipTimer = setTimeout(() => showTip(el), 350);
});
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[title],[data-tip]'); if (el && e.target.matches(':focus-visible')) { hideTip(); showTip(el); } });
document.addEventListener('focusout', hideTip);
document.addEventListener('click', hideTip, true);
document.addEventListener('scroll', hideTip, true);

/* ============ keys ============ */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openMenu) return closeMenu();
  if ($('#lightbox').classList.contains('on')) return $('#lightbox').classList.remove('on');
  if ($('#scrim-confirm').classList.contains('on')) return $('#scrim-confirm').classList.remove('on');
  if ($('#scrim-sm').classList.contains('on')) return smClose();
  const d = $('#drawer'); if (d && d.classList.contains('on')) return d.classList.remove('on');
  if ($('#scrim-post').classList.contains('on')) return closePost();
  if ($('#scrim-res').classList.contains('on')) { if (editDirty()) return $('[data-rclose]', $('#res-modal')).click(); return closeRes(); }
});

renderNav(); render.dash();
</script>
